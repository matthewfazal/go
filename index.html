<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<script>
// In a normal browser, go straight to the deal before anything shows.
(function () {
  var ua = navigator.userAgent || "";
  if (/musical_ly|bytedance|tiktok|trill_|BytedanceWebview|Instagram|FBAN|FBAV|FB_IAB/i.test(ua)) return;
  var ALLOWED = ["leasingcom.sjv.io", "leasing.com", "www.leasing.com"];
  var raw = new URLSearchParams(window.location.search).get("to") || "https://leasingcom.sjv.io/enPbqO";
  try {
    var u = new URL(raw);
    if (u.protocol === "https:" && ALLOWED.indexOf(u.hostname.toLowerCase()) !== -1) window.location.replace(u.href);
  } catch (e) {}
})();
</script>
<title>Best UK Leasing Deals</title>
<meta name="description" content="Today's best UK car lease deals on Leasing.com.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #FFFFFF;
    --soft: rgba(255,255,255,.78);
    --accent: #F4C430;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--ink);
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #0B0316 0%, #1A0828 22%, #6A2A55 48%, #8E3B5C 66%, #5A3F9E 100%);
    background-color: #2A0F3A;
    padding: env(safe-area-inset-top, 0) 16px env(safe-area-inset-bottom, 0);
  }
  .wrap { max-width: 30rem; margin: 0 auto; padding: 18px 0 48px; text-align: center; }
  .logo { display: block; width: 100%; max-width: 440px; height: auto; margin: 0 auto; }
  h1 { font-family: "Space Mono", ui-monospace, monospace; font-weight: 400; font-size: clamp(2rem, 9vw, 2.6rem); line-height: 1.1; margin: 4px 0 12px; letter-spacing: -.01em; }
  .lead { font-size: 1.1rem; line-height: 1.45; color: var(--soft); margin: 0 auto 26px; max-width: 26rem; }
  .dots { display: inline-flex; gap: 3px; vertical-align: middle; background: var(--ink); border-radius: 999px; padding: 6px 9px; margin: 0 2px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: #1A0828; display: block; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 58px; border-radius: 999px;
    border: 0; font: inherit; font-weight: 800; font-size: 1.08rem; cursor: pointer; text-decoration: none; margin-top: 12px; }
  .btn-main { background: var(--ink); color: #3B1450; box-shadow: 0 10px 28px rgba(0,0,0,.25); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* arrow pointing up to the in-app browser menu (top right) */
  .pointer { position: fixed; top: 6px; right: 10px; z-index: 5; pointer-events: none; }
  .pointer svg { width: 96px; height: 96px; animation: nudge 1.2s ease-in-out infinite; filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
  @keyframes nudge { 0%,100% { transform: translate(0,0); } 50% { transform: translate(4px,-6px); } }
  @media (prefers-reduced-motion: reduce) { .pointer svg { animation: none; } }

  .hide { display: none !important; }
  body.inapp .wrap { padding-top: 110px; }
  body.inapp h1 { display: none; }
  .big { font-size: clamp(1.9rem, 8.5vw, 2.4rem); line-height: 1.3; font-weight: 600; margin: 28px 0 0; }
  .big b { font-weight: 800; color: var(--accent); }
  .big .dots { padding: 9px 13px; gap: 5px; vertical-align: 6px; }
  .big .dots i { width: 8px; height: 8px; }
</style>
</head>
<body>

<div class="pointer hide" id="pointer" aria-hidden="true">
  <svg viewBox="0 0 64 64" fill="none" stroke="#F4C430" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 52 L48 16"/><path d="M26 14 H50 V38"/></svg>
</div>

<main class="wrap">
  <img class="logo" src="logo.webp" alt="UKLD, UK Leasing Deals" width="880" height="288">
  <h1>Best UK Leasing Deals</h1>

  <!-- Shown inside TikTok / Instagram in-app browsers -->
  <section id="inapp" class="hide">
    <p class="big">Tap <span class="dots" aria-label="the three dots"><i></i><i></i><i></i></span> then<br><b>Open in browser</b></p>
  </section>

  <!-- Shown in Safari / Chrome -->
  <section id="normal" class="hide">
    <p class="lead">Taking you to today's deals…</p>
    <a class="btn btn-main hide" id="go-btn" href="#">See today's deals</a>
  </section>

  <!-- Shown if the link is missing or not allowed -->
  <section id="broken" class="hide">
    <p class="lead">Sorry, this link isn't set up properly. Please go back and try again.</p>
  </section>
</main>

<script>
(function () {
  // Only send people to these sites, so nobody can misuse this page to redirect elsewhere.
  var ALLOWED = ["leasingcom.sjv.io", "leasing.com", "www.leasing.com"];

  function show(id) { document.getElementById(id).classList.remove("hide"); }

  var params = new URLSearchParams(window.location.search);
  var raw = params.get("to") || "https://leasingcom.sjv.io/enPbqO";
  var target = null;
  try {
    var u = new URL(raw);
    if (u.protocol === "https:" && ALLOWED.indexOf(u.hostname.toLowerCase()) !== -1) target = u.href;
  } catch (e) {}

  if (!target) { show("broken"); return; }

  var ua = navigator.userAgent || "";
  var inApp = /musical_ly|bytedance|tiktok|trill_|BytedanceWebview|Instagram|FBAN|FBAV|FB_IAB/i.test(ua);

  if (!inApp) {
    show("normal");
    var go = document.getElementById("go-btn");
    go.href = target;
    window.location.replace(target);
    // Backup button only if the jump hasn't happened after a few seconds.
    setTimeout(function () { go.classList.remove("hide"); }, 3000);
    return;
  }

  // Inside TikTok / Instagram: no direct link to Leasing.com at all.
  show("inapp");
  show("pointer");
  document.body.classList.add("inapp");
})();
</script>
</body>
</html>
